\* Deliberately broken rule: confirmations never expire.
\* A hidden late write can leave Telegram wrong without another repair.
\* Expected result: a Repair temporal-property counterexample.

SPECIFICATION LiveSpec
CONSTANTS
  Values = {a, b}
  Generations = {g0}
  MaxRequests = 3
  Mutation = "noLease"
INVARIANTS TypeOK StateShape ConfirmationEvidence
PROPERTY Repair
CHECK_DEADLOCK FALSE
