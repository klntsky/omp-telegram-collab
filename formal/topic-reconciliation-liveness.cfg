\* Check conditional eventual repair of the actual Telegram value.
\* LiveSpec adds progress assumptions; Repair also requires stable input and
\* enough unused request identities. Passing is not an unbounded retry proof.
\* This scope uses one generation and three requests, unlike the safety scope.

SPECIFICATION LiveSpec
CONSTANTS
  Values = {a, b}
  Generations = {g0}
  MaxRequests = 3
  Mutation = "correct"
INVARIANTS TypeOK StateShape ConfirmationEvidence
PROPERTY Repair
CHECK_DEADLOCK FALSE
