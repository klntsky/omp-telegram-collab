\* Check the intended protocol for bad reachable states in this finite scope.
\* No progress assumptions are needed for these invariants.
\* ConfirmationEvidence checks justified confirmation, not remote equality.
\* Deadlock checks are disabled because finite request capacity can run out.
\* Recovery is checked separately by the liveness configuration.

SPECIFICATION SafetySpec
CONSTANTS
  Values = {a, b}
  Generations = {g0, g1}
  MaxRequests = 2
  Mutation = "correct"
INVARIANTS TypeOK StateShape ConfirmationEvidence
CHECK_DEADLOCK FALSE
